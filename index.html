<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131d2a" media="(prefers-color-scheme: dark)">
<title>Library</title>
<style>
:root{--bg:#eef1f6;--ink:#1b2a41;--mute:#5d6b82;--card:#fff;--bar:#fff;--line:#d5dce8;--accent:#ffc83d;--on:#1b2a41;--sk:#e1e7f0;--shadow:0 1px 2px #1b2a4122,0 6px 16px #1b2a4118}
@media(prefers-color-scheme:dark){:root{--bg:#0e151f;--ink:#e8edf5;--mute:#93a1b8;--card:#172231;--bar:#131d2a;--line:#2a384b;--sk:#1b2a3b;--shadow:0 1px 2px #0008,0 6px 16px #0006}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.4;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input{font:inherit;color:var(--ink)}
button{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;padding:0 8px;background:transparent;border:1px solid transparent;border-radius:10px;cursor:pointer}
button:hover{background:var(--sk)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:var(--bar);border-bottom:1px solid var(--line)}
h1{flex:1;min-width:0;margin:0 0 0 4px;font-size:1.15rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav{display:flex;align-items:center;gap:2px}
#goto{width:56px;height:36px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:8px;-moz-appearance:textfield}
#goto::-webkit-inner-spin-button,#goto::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#of{color:var(--mute);font-size:.85rem;min-width:34px;font-variant-numeric:tabular-nums}
#dl{background:var(--ink);color:var(--bg);font-weight:600;font-size:.85rem;white-space:nowrap}
#dl:hover{background:var(--ink)}
#prog{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);display:none}
body.reading #prog{display:block}
#library{display:flex;gap:16px;padding:24px 16px 40px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 16px;-webkit-overflow-scrolling:touch}
.book{flex:0 0 150px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;color:inherit;text-decoration:none}
.cover{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;border-radius:3px 8px 8px 3px;background:hsl(var(--h) 32% 38%);box-shadow:var(--shadow);transition:transform .12s}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0005 0,#0000 8%);pointer-events:none}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.ini{position:absolute;inset:0;display:grid;place-items:center;font-size:2.6rem;font-weight:800;color:#ffffffa0}
.book:active .cover{transform:scale(.97)}
.book b{font-size:.98rem;font-weight:700;line-height:1.25}
.book small{color:var(--mute);font-size:.82rem}
#view{overflow-x:auto;overflow-y:hidden;width:100%}
#pages{width:calc(min(100vw,900px)*var(--z,1));margin:0 auto;padding:14px 10px 96px}
.page{position:relative;display:flex;align-items:center;justify-content:center;margin:0 0 14px;aspect-ratio:var(--ar,.7);background:var(--sk);border-radius:2px;box-shadow:var(--shadow)}
.page.ready{background:#fff}
.page img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;user-select:none}
.num{position:absolute;left:8px;bottom:8px;z-index:2;padding:2px 9px;border-radius:99px;background:#1b2a41cc;color:#fff;font-size:.75rem;font-variant-numeric:tabular-nums}
.page:not(.ready) .num{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);background:none;color:var(--mute);font-size:1.5rem}
.tools{position:absolute;top:8px;right:8px;z-index:2;display:flex;align-items:center;gap:10px;padding:4px 12px;border-radius:99px;background:var(--bar);border:1px solid var(--line);box-shadow:var(--shadow);font-size:.82rem}
.tools label{display:flex;align-items:center;gap:6px}
.tools a{color:var(--ink);font-weight:700;text-decoration:none}
.err{position:absolute;z-index:3;height:auto;padding:9px 14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.88rem}
.err:hover{background:var(--ink)}
.ann{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#pages.tool .page{touch-action:none;user-select:none;cursor:crosshair}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;scrollbar-width:none;background:var(--bar);border-top:1px solid var(--line)}
#bar::-webkit-scrollbar{display:none}
#bar button{flex:none}
#bar button.on{background:var(--accent);color:var(--on)}
#zlvl{min-width:58px;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.sep{flex:none;width:1px;height:24px;margin:0 6px;background:var(--line)}
#col{flex:none;width:32px;height:32px;padding:0;border:0;border-radius:50%;background:none;-webkit-appearance:none;appearance:none;cursor:pointer}
#col::-webkit-color-swatch-wrapper{padding:0}
#col::-webkit-color-swatch{border:2px solid var(--line);border-radius:50%}
#col::-moz-color-swatch{border:2px solid var(--line);border-radius:50%}
#sz{flex:none;width:84px;accent-color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <button id="back" hidden></button>
  <h1 id="title">Library</h1>
  <span id="nav" hidden>
    <button id="prev"></button>
    <input id="goto" type="number" inputmode="numeric" min="1" value="1" aria-label="Page number">
    <span id="of"></span>
    <button id="next"></button>
  </span>
  <button id="dl" hidden>Download selected (0)</button>
  <div id="prog"></div>
</header>
<div id="library"></div>
<div id="view"><div id="pages" hidden></div></div>
<div id="bar" hidden>
  <button data-tool="hand" class="on" title="Scroll"></button>
  <button id="zout" title="Zoom out"></button>
  <button id="zlvl" title="Reset zoom to 100%">100%</button>
  <button id="zin" title="Zoom in"></button>
  <i class="sep"></i>
  <button data-tool="pen" title="Pen"></button>
  <button data-tool="hl" title="Highlighter"></button>
  <button data-tool="line" title="Line"></button>
  <button data-tool="arrow" title="Arrow"></button>
  <button data-tool="rect" title="Rectangle"></button>
  <button data-tool="ell" title="Circle"></button>
  <button data-tool="erase" title="Eraser"></button>
  <i class="sep"></i>
  <input type="color" id="col" value="#e53935" title="Colour" aria-label="Colour">
  <input type="range" id="sz" min="1" max="12" value="3" title="Thickness" aria-label="Thickness">
  <i class="sep"></i>
  <button id="undo" title="Undo"></button>
  <button id="clr" title="Clear this page"></button>
</div>

<script>
// ---------- EDIT HERE ----------
const SITE = {
  title: "Library",
  supabaseUrl: "https://poijfoicrisdxiwhgiis.supabase.co",
  previewBucket: "previews",
  prefetchAhead: 2
};
// One entry per book.
//  id:      short code used in the link (#book1)
//  folder:  folder inside the previews bucket ("" = bucket root, as for your first book)
//  v:       optional number; raise it if a folder was re-uploaded with different pages (clears stale cached images)
//  pdfBucket / pdfName: only needed once you upload per-page PDFs; leave "" to hide downloads
const BOOKS = [
  { id: "book1", title: "RD Sharma", pages: 744, folder: "",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "book3", title: "Maths NCERT", pages: 282, folder: "book3",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "book10", title: "Science NCERT", pages: 282, folder: "book10",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "geo", title: "Geo", pages: 100, folder: "geo",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "his", title: "History", pages: 196, folder: "his",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "eco", title: "Economics", pages: 93, folder: "eco",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "civics", title: "Civics", pages: 114, folder: "civics",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "englishlit", title: "English Lit", pages: 218, folder: "englishlit",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "scienceexampler", title: "Science Exemplar", pages: 223, folder: "scienceexampler",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "mathexampler", title: "Math Exemplar", pages: 198, folder: "mathexampler",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "practicalsscience", title: "Science Practicals", pages: 58, folder: "practicalsscience",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` }
];
// -------------------------------

const $ = id => document.getElementById(id);
const pub = (b, f) => `${SITE.supabaseUrl}/storage/v1/object/public/${b}/${f}`;
const prevUrl = (bk, n) => pub(SITE.previewBucket, (bk.folder ? bk.folder + "/" : "") + `p${String(n).padStart(3, "0")}.webp`) + (bk.v ? "?v=" + bk.v : "");
const wrap = $("pages");
let io = null, cur = null, sel = new Set();

document.title = SITE.title;
$("title").textContent = SITE.title;

// ----- Library view -----
const lib = $("library");
BOOKS.forEach((bk, i) => {
  const a = document.createElement("a");
  a.className = "book"; a.href = "#" + bk.id;
  a.innerHTML = `<span class="cover" style="--h:${(i * 47 + 205) % 360}"><span class="ini">${bk.title[0]}</span><img loading="lazy" alt="" src="${prevUrl(bk, 1)}" onerror="this.remove()"></span><b>${bk.title}</b><small>${bk.pages} pages</small>`;
  lib.appendChild(a);
});

// ----- Reader view -----
function openBook(bk) {
  closeBook();
  cur = bk; sel = new Set();
  lib.hidden = true; wrap.hidden = false; document.body.classList.add("reading");
  $("back").hidden = false; $("nav").hidden = false;
  $("title").textContent = bk.title;
  $("of").textContent = "/ " + bk.pages;
  $("goto").value = 1;
  const hasPdf = !!bk.pdfBucket;
  $("dl").hidden = !hasPdf;
  $("dl").textContent = "Download selected (0)";

  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const n = +e.target.dataset.n;
    for (let i = n; i <= Math.min(n + SITE.prefetchAhead, bk.pages); i++) load(i);
  }), { rootMargin: "600px 0px" });

  for (let n = 1; n <= bk.pages; n++) {
    const d = document.createElement("div");
    d.className = "page"; d.dataset.n = n;
    d.innerHTML = (hasPdf ? `<div class="tools"><label><input type="checkbox" data-n="${n}"> select</label>
      <a href="${pub(bk.pdfBucket, bk.pdfName(n))}" download>PDF</a></div>` : "") + `<span class="num">${n}</span>`;
    wrap.appendChild(d); io.observe(d);
  }
  Ann.open(bk);
  window.scrollTo(0, 0);
}

function closeBook() {
  if (io) io.disconnect();
  io = null; cur = null; wrap.innerHTML = "";
  wrap.hidden = true; lib.hidden = false; document.body.classList.remove("reading");
  $("back").hidden = true; $("nav").hidden = true; $("dl").hidden = true; Ann.close();
  $("title").textContent = SITE.title;
}

function load(n) {
  const el = wrap.children[n - 1];
  if (!el || el.dataset.loaded) return;
  el.dataset.loaded = 1;
  const img = new Image();
  img.alt = "Page " + n;
  img.onload = () => {
    el.style.setProperty("--ar", img.naturalWidth / img.naturalHeight);
    el.classList.add("ready");
    const e = el.querySelector(".err"); if (e) e.remove();
    Ann.draw(el);
  };
  img.onerror = () => {
    el.dataset.loaded = "";
    img.remove();
    if (el.querySelector(".err")) return;
    const b = document.createElement("button");
    b.className = "err"; b.textContent = "Couldn't load page " + n + ". Tap to retry";
    b.onclick = () => { b.remove(); load(n); };
    el.appendChild(b);
  };
  img.src = prevUrl(cur, n);
  const old = el.querySelector("img"); if (old) old.remove();
  el.prepend(img); Ann.attach(el);
}

wrap.addEventListener("change", e => {
  if (e.target.type !== "checkbox") return;
  e.target.checked ? sel.add(+e.target.dataset.n) : sel.delete(+e.target.dataset.n);
  $("dl").textContent = `Download selected (${sel.size})`;
});

$("dl").onclick = async () => {
  const bk = cur;
  for (const n of [...sel].sort((a, b) => a - b)) {
    const r = await fetch(pub(bk.pdfBucket, bk.pdfName(n)));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await r.blob());
    a.download = bk.pdfName(n);
    a.click();
    await new Promise(r => setTimeout(r, 400));
  }
};

const go = n => { if (!cur) return; n = Math.max(1, Math.min(cur.pages, n)); wrap.children[n - 1].scrollIntoView(); };
$("goto").onchange = e => go(+e.target.value);
$("prev").onclick = () => go(+$("goto").value - 1);
$("next").onclick = () => go(+$("goto").value + 1);
$("back").onclick = () => { location.hash = ""; };

// ----- Drawing + magnifier -----
// Shapes are stored as fractions of the page, so they stay aligned at any screen size.
// Annotations are saved in this browser (localStorage) on this device only.
const Ann = (() => {
  let bk = null, data = {}, tool = "hand", undo = [], live = null, liveEl = null, active = null, saveT;
  const key = () => "ann:" + bk.id;
  const shapes = n => data[n] || (data[n] = []);
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(() => { try { localStorage.setItem(key(), JSON.stringify(data)); } catch (e) {} }, 400);
  }
  function poly(s) {
    const p = s.p;
    if (s.t === "rect") { const [a, b] = p; return [[a[0],a[1]],[b[0],a[1]],[b[0],b[1]],[a[0],b[1]],[a[0],a[1]]]; }
    if (s.t === "ell") {
      const [a, b] = p, cx = (a[0]+b[0])/2, cy = (a[1]+b[1])/2, rx = Math.abs(b[0]-a[0])/2, ry = Math.abs(b[1]-a[1])/2, o = [];
      for (let i = 0; i <= 48; i++) { const t = i/48*2*Math.PI; o.push([cx+rx*Math.cos(t), cy+ry*Math.sin(t)]); }
      return o;
    }
    return p;
  }
  function paint(x, s, w, h) {
    x.save(); x.lineCap = x.lineJoin = "round"; x.strokeStyle = s.c; x.lineWidth = s.w * w;
    if (s.t === "hl") x.globalAlpha = 0.35;
    const q = poly(s).map(a => [a[0]*w, a[1]*h]);
    x.beginPath(); q.forEach((a, i) => i ? x.lineTo(a[0], a[1]) : x.moveTo(a[0], a[1]));
    if (q.length === 1) x.lineTo(q[0][0] + 0.1, q[0][1]);
    x.stroke();
    if (s.t === "arrow" && q.length >= 2) {
      const [a, b] = q, g = Math.atan2(b[1]-a[1], b[0]-a[0]), L = Math.max(12, s.w*w*4);
      x.beginPath();
      x.moveTo(b[0], b[1]); x.lineTo(b[0]-L*Math.cos(g-0.45), b[1]-L*Math.sin(g-0.45));
      x.moveTo(b[0], b[1]); x.lineTo(b[0]-L*Math.cos(g+0.45), b[1]-L*Math.sin(g+0.45));
      x.stroke();
    }
    x.restore();
  }
  function draw(el) {
    const c = el.querySelector("canvas.ann"); if (!c || !bk) return;
    const w = el.clientWidth, h = el.clientHeight, d = devicePixelRatio || 1;
    if (c.width !== Math.round(w*d) || c.height !== Math.round(h*d)) { c.width = Math.round(w*d); c.height = Math.round(h*d); }
    const x = c.getContext("2d"); x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, w, h);
    const list = [...(data[el.dataset.n] || [])]; if (live && liveEl === el) list.push(live);
    list.forEach(s => paint(x, s, w, h));
  }
  function attach(el) {
    if (el.querySelector("canvas.ann")) return;
    const c = document.createElement("canvas"); c.className = "ann"; el.appendChild(c); draw(el);
  }
  function hit(s, px, py, w, h, r) {
    const q = poly(s).map(a => [a[0]*w, a[1]*h]);
    for (let i = 0; i < q.length; i++) {
      const a = q[i], b = q[i+1] || a, dx = b[0]-a[0], dy = b[1]-a[1], l = dx*dx + dy*dy;
      let t = l ? ((px-a[0])*dx + (py-a[1])*dy) / l : 0; t = Math.max(0, Math.min(1, t));
      if (Math.hypot(px-a[0]-t*dx, py-a[1]-t*dy) <= r + s.w*w/2) return true;
    }
    return false;
  }
  function erase(el, p) {
    const n = el.dataset.n, list = shapes(n), w = el.clientWidth, h = el.clientHeight;
    for (let i = list.length - 1; i >= 0; i--) {
      if (hit(list[i], p[0]*w, p[1]*h, w, h, 14)) { undo.push({ k: "del", n, s: list[i], i }); list.splice(i, 1); draw(el); save(); return; }
    }
  }
  const pt = (e, el) => { const r = el.getBoundingClientRect(); return [(e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height]; };
  wrap.addEventListener("pointerdown", e => {
    if (tool === "hand") return;
    const el = e.target.closest(".page");
    if (!el || e.target.closest(".tools")) return;
    e.preventDefault(); el.setPointerCapture(e.pointerId); active = el;
    const p = pt(e, el);
    if (tool === "erase") return erase(el, p);
    const w = (tool === "hl" ? $("sz").value * 3 : $("sz").value) / 700;
    live = { t: tool, c: $("col").value, w, p: (tool === "pen" || tool === "hl") ? [p] : [p, p] };
    liveEl = el; draw(el);
  });
  wrap.addEventListener("pointermove", e => {
    if (!active) return;
    const p = pt(e, active);
    if (tool === "erase") return erase(active, p);
    if (!live) return;
    if (tool === "pen" || tool === "hl") live.p.push(p); else live.p[1] = p;
    draw(active);
  });
  function end() {
    if (live && liveEl) {
      const n = liveEl.dataset.n; shapes(n).push(live); undo.push({ k: "add", n, s: live });
      live = null; draw(liveEl); save();
    }
    active = null; liveEl = null;
  }
  wrap.addEventListener("pointerup", end);
  wrap.addEventListener("pointercancel", end);

  function setTool(t) {
    tool = t; wrap.classList.toggle("tool", t !== "hand");
    document.querySelectorAll("#bar [data-tool]").forEach(b => b.classList.toggle("on", b.dataset.tool === t));
    $("sz").hidden = $("col").hidden = t === "erase" || t === "hand";
  }
  $("bar").addEventListener("click", e => { const b = e.target.closest("[data-tool]"); if (b) setTool(b.dataset.tool); });
  const redraw = n => { const el = wrap.children[n-1]; if (el) draw(el); };
  $("undo").onclick = () => {
    const o = undo.pop(); if (!o) return;
    const list = shapes(o.n);
    if (o.k === "clear") data[o.n] = o.list;
    else if (o.k === "add") { const i = list.indexOf(o.s); if (i >= 0) list.splice(i, 1); } else list.splice(o.i, 0, o.s);
    redraw(o.n); save();
  };
  $("clr").onclick = () => {
    const mid = document.elementFromPoint(innerWidth / 2, innerHeight / 2),
          el = mid && mid.closest(".page"), n = el ? +el.dataset.n : +$("goto").value;
    if (!(data[n] || []).length) return;
    undo.push({ k: "clear", n, list: data[n] });
    data[n] = []; redraw(n); save();
  };
  window.addEventListener("resize", () => wrap.querySelectorAll(".page[data-loaded]").forEach(draw));
  const LV = [25, 50, 75, 100, 125, 150, 200, 250, 300]; let zi = 3;
  function setZoom(i) {
    i = Math.max(0, Math.min(LV.length - 1, i));
    const de = document.documentElement, vw = $("view"), ry = scrollY / Math.max(1, de.scrollHeight), rx = vw.scrollLeft / Math.max(1, vw.scrollWidth);
    zi = i; wrap.style.setProperty("--z", LV[i] / 100); $("zlvl").textContent = LV[i] + "%";
    wrap.querySelectorAll(".page[data-loaded]").forEach(draw);
    vw.scrollLeft = rx * vw.scrollWidth; scrollTo(0, ry * de.scrollHeight);
  }
  $("zin").onclick = () => setZoom(zi + 1);
  $("zout").onclick = () => setZoom(zi - 1);
  $("zlvl").onclick = () => setZoom(3);
  return {
    attach, draw,
    open(b) { bk = b; undo = []; try { data = JSON.parse(localStorage.getItem(key()) || "{}"); } catch (e) { data = {}; } $("bar").hidden = false; setTool("hand"); setZoom(3); },
    close() { bk = null; data = {}; live = null; active = null; $("bar").hidden = true; }
  };
})();

// ----- Icons + reading progress -----
const IC = {
  hand: '<path d="M5 3l14 7-6 2-2 7z"/>',
  pen: '<path d="M4 20l1-4L16.5 4.5a2 2 0 013 0l.5.5a2 2 0 010 3L8.5 19z"/><path d="M14 7l3 3"/>',
  hl: '<path d="M9 12l5 5 6-6-5-5z"/><path d="M9 12l-4 6 4-1 5 0"/><path d="M4 21h8"/>',
  line: '<path d="M5 19L19 5"/>',
  arrow: '<path d="M5 19L19 5"/><path d="M10 5h9v9"/>',
  rect: '<rect x="4" y="6" width="16" height="12" rx="1.5"/>',
  ell: '<ellipse cx="12" cy="12" rx="8" ry="6"/>',
  erase: '<path d="M4 15l8-8 7 7-5 5H8z"/><path d="M10 9l7 7"/><path d="M14 21h6"/>',
  undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>',
  trash: '<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/>',
  minus: '<path d="M5 12h14"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  chevL: '<path d="M15 5l-7 7 7 7"/>',
  chevR: '<path d="M9 5l7 7-7 7"/>'
};
const svg = p => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
document.querySelectorAll("#bar [data-tool]").forEach(b => b.innerHTML = svg(IC[b.dataset.tool]));
[["undo","undo"],["clr","trash"],["zin","plus"],["zout","minus"],["back","chevL"],["prev","chevL"],["next","chevR"]]
  .forEach(([id, k]) => $(id).innerHTML = svg(IC[k]));
$("back").setAttribute("aria-label", "Back to library");
$("prev").setAttribute("aria-label", "Previous page");
$("next").setAttribute("aria-label", "Next page");
document.querySelectorAll("#bar button[title]").forEach(b => b.setAttribute("aria-label", b.title));
window.addEventListener("scroll", () => {
  if (!cur) return;
  const mid = document.elementFromPoint(innerWidth / 2, innerHeight / 2), pg = mid && mid.closest(".page");
  if (pg && document.activeElement !== $("goto")) $("goto").value = pg.dataset.n;
  const m = document.documentElement.scrollHeight - innerHeight;
  $("prog").style.transform = "scaleX(" + (m > 0 ? Math.min(1, scrollY / m) : 0) + ")";
}, { passive: true });

// ----- Routing: #book1 opens a book, empty hash shows the library -----
function route() {
  const bk = BOOKS.find(b => b.id === location.hash.slice(1));
  bk ? openBook(bk) : closeBook();
}
window.addEventListener("hashchange", route);
route();
</script>
