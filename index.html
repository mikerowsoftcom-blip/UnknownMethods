<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Library</title>
<style>
:root{--bg:#f6f1e7;--ink:#2b2418;--card:#fffaf0;--accent:#8a4b2a;--line:#d8cdb6}
@media(prefers-color-scheme:dark){:root{--bg:#1c1914;--ink:#eee6d5;--card:#26211a;--accent:#d9915f;--line:#3a3329}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:1.1rem;margin:0;flex:1 1 auto}
button,input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
button{cursor:pointer;background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=number]{width:70px}
[hidden]{display:none!important}
#library{max-width:900px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.book{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;text-decoration:none;color:inherit;display:block}
.book img{width:100%;aspect-ratio:0.7;object-fit:cover;display:block;background:var(--line)}
.book div{padding:8px 10px;font-size:.95rem}
.book small{display:block;opacity:.6}
#view{overflow-x:auto;overflow-y:hidden;width:100%}
#pages{width:calc(min(100vw,900px)*var(--z,1));margin:0 auto;padding:12px}
.page{position:relative;background:var(--card);border:1px solid var(--line);margin:0 0 14px;aspect-ratio:var(--ar,0.7);display:flex;align-items:center;justify-content:center}
.page img{width:100%;height:100%;object-fit:contain;display:block}
.tools{position:absolute;top:6px;right:6px;display:flex;gap:6px;align-items:center;background:var(--card);padding:3px 6px;border-radius:6px;border:1px solid var(--line);font-size:.85rem}
.tools a{color:var(--accent);text-decoration:none}
.num{position:absolute;bottom:6px;left:8px;font-size:.8rem;opacity:.6}
#pages{padding-bottom:80px}
.tools,.num{z-index:2}
.ann{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.page img{-webkit-user-drag:none;user-select:none}
#pages.tool .page{touch-action:none;user-select:none;cursor:crosshair}
#bar{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;gap:6px;padding:6px 8px;overflow-x:auto;align-items:center}
#bar button{background:var(--bg);color:var(--ink);border-color:var(--line);flex:none;min-width:40px;padding:6px}
#bar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#bar input[type=color]{width:40px;height:34px;padding:0;flex:none}
#bar input[type=range]{width:80px;flex:none;padding:0}
</style>
</head>
<body>
<header>
  <button id="back" hidden>‹ Library</button>
  <h1 id="title">Class Library</h1>
  <span id="nav" hidden>
    <button id="prev">‹</button>
    <input id="goto" type="number" min="1" value="1">
    <span id="of"></span>
    <button id="next">›</button>
  </span>
  <button id="dl" hidden>Download selected (0)</button>
</header>
<div id="library"></div>
<div id="view"><div id="pages" hidden></div></div>
<div id="bar" hidden>
  <button data-tool="hand" class="on" title="Scroll">✋</button>
  <button id="zout" title="Zoom out">−</button><button id="zlvl" title="Reset to 100%">100%</button><button id="zin" title="Zoom in">+</button>
  <button data-tool="pen" title="Pen">✏️</button>
  <button data-tool="hl" title="Highlighter">🖍</button>
  <button data-tool="line" title="Line">╱</button>
  <button data-tool="arrow" title="Arrow">➚</button>
  <button data-tool="rect" title="Rectangle">▭</button>
  <button data-tool="ell" title="Circle">◯</button>
  <button data-tool="erase" title="Eraser">🧽</button>
  <input type="color" id="col" value="#e53935" title="Colour">
  <input type="range" id="sz" min="1" max="12" value="3" title="Thickness">
  <button id="undo" title="Undo">↶</button>
  <button id="clr" title="Clear this page">🗑</button>
</div>

<script>
// ---------- EDIT HERE ----------
const SITE = {
  title: "Class Library",
  supabaseUrl: "https://poijfoicrisdxiwhgiis.supabase.co",
  previewBucket: "previews",
  prefetchAhead: 2
};
// One entry per book.
//  id:      short code used in the link (#book1)
//  folder:  folder inside the previews bucket ("" = bucket root, as for your first book)
//  v:       optional number; raise it if a folder was re-uploaded with different pages (clears stale cached images)
//  pdfBucket / pdfName: only needed once you upload per-page PDFs; leave "" to hide downloads
const BOOKS = [
  { id: "book1", title: "RD Sharma", pages: 744, folder: "",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "book3", title: "Maths NCERT", pages: 282, folder: "book3",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "book10", title: "Science NCERT", pages: 282, folder: "book10",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "geo", title: "Geo", pages: 100, folder: "geo",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "his", title: "History", pages: 196, folder: "his",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "eco", title: "Economics", pages: 93, folder: "eco",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "civics", title: "Civics", pages: 114, folder: "civics",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` },
  { id: "englishlit", title: "English Lit", pages: 218, folder: "englishlit",
    pdfBucket: "", pdfName: n => `page-${n}.pdf` }
];
// -------------------------------

const $ = id => document.getElementById(id);
const pub = (b, f) => `${SITE.supabaseUrl}/storage/v1/object/public/${b}/${f}`;
const prevUrl = (bk, n) => pub(SITE.previewBucket, (bk.folder ? bk.folder + "/" : "") + `p${String(n).padStart(3, "0")}.webp`) + (bk.v ? "?v=" + bk.v : "");
const wrap = $("pages");
let io = null, cur = null, sel = new Set();

document.title = SITE.title;
$("title").textContent = SITE.title;

// ----- Library view -----
const lib = $("library");
BOOKS.forEach(bk => {
  const a = document.createElement("a");
  a.className = "book"; a.href = "#" + bk.id;
  a.innerHTML = `<img loading="lazy" alt="" src="${prevUrl(bk, 1)}"><div>${bk.title}<small>${bk.pages} pages</small></div>`;
  lib.appendChild(a);
});

// ----- Reader view -----
function openBook(bk) {
  closeBook();
  cur = bk; sel = new Set();
  lib.hidden = true; wrap.hidden = false;
  $("back").hidden = false; $("nav").hidden = false;
  $("title").textContent = bk.title;
  $("of").textContent = "/ " + bk.pages;
  $("goto").value = 1;
  const hasPdf = !!bk.pdfBucket;
  $("dl").hidden = !hasPdf;
  $("dl").textContent = "Download selected (0)";

  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const n = +e.target.dataset.n;
    for (let i = n; i <= Math.min(n + SITE.prefetchAhead, bk.pages); i++) load(i);
    $("goto").value = n;
  }), { rootMargin: "600px 0px" });

  for (let n = 1; n <= bk.pages; n++) {
    const d = document.createElement("div");
    d.className = "page"; d.dataset.n = n;
    d.innerHTML = (hasPdf ? `<div class="tools"><label><input type="checkbox" data-n="${n}"> select</label>
      <a href="${pub(bk.pdfBucket, bk.pdfName(n))}" download>PDF</a></div>` : "") + `<span class="num">${n}</span>`;
    wrap.appendChild(d); io.observe(d);
  }
  Ann.open(bk);
  window.scrollTo(0, 0);
}

function closeBook() {
  if (io) io.disconnect();
  io = null; cur = null; wrap.innerHTML = "";
  wrap.hidden = true; lib.hidden = false;
  $("back").hidden = true; $("nav").hidden = true; $("dl").hidden = true; Ann.close();
  $("title").textContent = SITE.title;
}

function load(n) {
  const el = wrap.children[n - 1];
  if (!el || el.dataset.loaded) return;
  el.dataset.loaded = 1;
  const img = new Image();
  img.alt = "Page " + n;
  img.onload = () => { el.style.setProperty("--ar", img.naturalWidth / img.naturalHeight); Ann.draw(el); };
  img.onerror = () => { el.dataset.loaded = ""; if (!el.querySelector("span.err")) el.insertAdjacentHTML("beforeend", '<span class="err">Failed to load. Scroll away and back to retry.</span>'); };
  img.src = prevUrl(cur, n);
  el.prepend(img); Ann.attach(el);
}

wrap.addEventListener("change", e => {
  if (e.target.type !== "checkbox") return;
  e.target.checked ? sel.add(+e.target.dataset.n) : sel.delete(+e.target.dataset.n);
  $("dl").textContent = `Download selected (${sel.size})`;
});

$("dl").onclick = async () => {
  const bk = cur;
  for (const n of [...sel].sort((a, b) => a - b)) {
    const r = await fetch(pub(bk.pdfBucket, bk.pdfName(n)));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await r.blob());
    a.download = bk.pdfName(n);
    a.click();
    await new Promise(r => setTimeout(r, 400));
  }
};

const go = n => { if (!cur) return; n = Math.max(1, Math.min(cur.pages, n)); wrap.children[n - 1].scrollIntoView(); };
$("goto").onchange = e => go(+e.target.value);
$("prev").onclick = () => go(+$("goto").value - 1);
$("next").onclick = () => go(+$("goto").value + 1);
$("back").onclick = () => { location.hash = ""; };

// ----- Drawing + magnifier -----
// Shapes are stored as fractions of the page, so they stay aligned at any screen size.
// Annotations are saved in this browser (localStorage) on this device only.
const Ann = (() => {
  let bk = null, data = {}, tool = "hand", undo = [], live = null, liveEl = null, active = null, saveT;
  const key = () => "ann:" + bk.id;
  const shapes = n => data[n] || (data[n] = []);
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(() => { try { localStorage.setItem(key(), JSON.stringify(data)); } catch (e) {} }, 400);
  }
  function poly(s) {
    const p = s.p;
    if (s.t === "rect") { const [a, b] = p; return [[a[0],a[1]],[b[0],a[1]],[b[0],b[1]],[a[0],b[1]],[a[0],a[1]]]; }
    if (s.t === "ell") {
      const [a, b] = p, cx = (a[0]+b[0])/2, cy = (a[1]+b[1])/2, rx = Math.abs(b[0]-a[0])/2, ry = Math.abs(b[1]-a[1])/2, o = [];
      for (let i = 0; i <= 48; i++) { const t = i/48*2*Math.PI; o.push([cx+rx*Math.cos(t), cy+ry*Math.sin(t)]); }
      return o;
    }
    return p;
  }
  function paint(x, s, w, h) {
    x.save(); x.lineCap = x.lineJoin = "round"; x.strokeStyle = s.c; x.lineWidth = s.w * w;
    if (s.t === "hl") x.globalAlpha = 0.35;
    const q = poly(s).map(a => [a[0]*w, a[1]*h]);
    x.beginPath(); q.forEach((a, i) => i ? x.lineTo(a[0], a[1]) : x.moveTo(a[0], a[1]));
    if (q.length === 1) x.lineTo(q[0][0] + 0.1, q[0][1]);
    x.stroke();
    if (s.t === "arrow" && q.length >= 2) {
      const [a, b] = q, g = Math.atan2(b[1]-a[1], b[0]-a[0]), L = Math.max(12, s.w*w*4);
      x.beginPath();
      x.moveTo(b[0], b[1]); x.lineTo(b[0]-L*Math.cos(g-0.45), b[1]-L*Math.sin(g-0.45));
      x.moveTo(b[0], b[1]); x.lineTo(b[0]-L*Math.cos(g+0.45), b[1]-L*Math.sin(g+0.45));
      x.stroke();
    }
    x.restore();
  }
  function draw(el) {
    const c = el.querySelector("canvas.ann"); if (!c || !bk) return;
    const w = el.clientWidth, h = el.clientHeight, d = devicePixelRatio || 1;
    if (c.width !== Math.round(w*d) || c.height !== Math.round(h*d)) { c.width = Math.round(w*d); c.height = Math.round(h*d); }
    const x = c.getContext("2d"); x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, w, h);
    const list = [...(data[el.dataset.n] || [])]; if (live && liveEl === el) list.push(live);
    list.forEach(s => paint(x, s, w, h));
  }
  function attach(el) {
    if (el.querySelector("canvas.ann")) return;
    const c = document.createElement("canvas"); c.className = "ann"; el.appendChild(c); draw(el);
  }
  function hit(s, px, py, w, h, r) {
    const q = poly(s).map(a => [a[0]*w, a[1]*h]);
    for (let i = 0; i < q.length; i++) {
      const a = q[i], b = q[i+1] || a, dx = b[0]-a[0], dy = b[1]-a[1], l = dx*dx + dy*dy;
      let t = l ? ((px-a[0])*dx + (py-a[1])*dy) / l : 0; t = Math.max(0, Math.min(1, t));
      if (Math.hypot(px-a[0]-t*dx, py-a[1]-t*dy) <= r + s.w*w/2) return true;
    }
    return false;
  }
  function erase(el, p) {
    const n = el.dataset.n, list = shapes(n), w = el.clientWidth, h = el.clientHeight;
    for (let i = list.length - 1; i >= 0; i--) {
      if (hit(list[i], p[0]*w, p[1]*h, w, h, 14)) { undo.push({ k: "del", n, s: list[i], i }); list.splice(i, 1); draw(el); save(); return; }
    }
  }
  const pt = (e, el) => { const r = el.getBoundingClientRect(); return [(e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height]; };
  wrap.addEventListener("pointerdown", e => {
    if (tool === "hand") return;
    const el = e.target.closest(".page");
    if (!el || e.target.closest(".tools")) return;
    e.preventDefault(); el.setPointerCapture(e.pointerId); active = el;
    const p = pt(e, el);
    if (tool === "erase") return erase(el, p);
    const w = (tool === "hl" ? $("sz").value * 3 : $("sz").value) / 700;
    live = { t: tool, c: $("col").value, w, p: (tool === "pen" || tool === "hl") ? [p] : [p, p] };
    liveEl = el; draw(el);
  });
  wrap.addEventListener("pointermove", e => {
    if (!active) return;
    const p = pt(e, active);
    if (tool === "erase") return erase(active, p);
    if (!live) return;
    if (tool === "pen" || tool === "hl") live.p.push(p); else live.p[1] = p;
    draw(active);
  });
  function end() {
    if (live && liveEl) {
      const n = liveEl.dataset.n; shapes(n).push(live); undo.push({ k: "add", n, s: live });
      live = null; draw(liveEl); save();
    }
    active = null; liveEl = null;
  }
  wrap.addEventListener("pointerup", end);
  wrap.addEventListener("pointercancel", end);

  function setTool(t) {
    tool = t; wrap.classList.toggle("tool", t !== "hand");
    document.querySelectorAll("#bar [data-tool]").forEach(b => b.classList.toggle("on", b.dataset.tool === t));
    $("sz").hidden = $("col").hidden = t === "erase" || t === "hand";
  }
  $("bar").addEventListener("click", e => { const b = e.target.closest("[data-tool]"); if (b) setTool(b.dataset.tool); });
  const redraw = n => { const el = wrap.children[n-1]; if (el) draw(el); };
  $("undo").onclick = () => {
    const o = undo.pop(); if (!o) return;
    const list = shapes(o.n);
    if (o.k === "clear") data[o.n] = o.list;
    else if (o.k === "add") { const i = list.indexOf(o.s); if (i >= 0) list.splice(i, 1); } else list.splice(o.i, 0, o.s);
    redraw(o.n); save();
  };
  $("clr").onclick = () => {
    const mid = document.elementFromPoint(innerWidth / 2, innerHeight / 2),
          el = mid && mid.closest(".page"), n = el ? +el.dataset.n : +$("goto").value;
    if (!(data[n] || []).length) return;
    undo.push({ k: "clear", n, list: data[n] });
    data[n] = []; redraw(n); save();
  };
  window.addEventListener("resize", () => wrap.querySelectorAll(".page[data-loaded]").forEach(draw));
  const LV = [25, 50, 75, 100, 125, 150, 200, 250, 300]; let zi = 3;
  function setZoom(i) {
    i = Math.max(0, Math.min(LV.length - 1, i));
    const de = document.documentElement, vw = $("view"), ry = scrollY / Math.max(1, de.scrollHeight), rx = vw.scrollLeft / Math.max(1, vw.scrollWidth);
    zi = i; wrap.style.setProperty("--z", LV[i] / 100); $("zlvl").textContent = LV[i] + "%";
    wrap.querySelectorAll(".page[data-loaded]").forEach(draw);
    vw.scrollLeft = rx * vw.scrollWidth; scrollTo(0, ry * de.scrollHeight);
  }
  $("zin").onclick = () => setZoom(zi + 1);
  $("zout").onclick = () => setZoom(zi - 1);
  $("zlvl").onclick = () => setZoom(3);
  return {
    attach, draw,
    open(b) { bk = b; undo = []; try { data = JSON.parse(localStorage.getItem(key()) || "{}"); } catch (e) { data = {}; } $("bar").hidden = false; setTool("hand"); setZoom(3); },
    close() { bk = null; data = {}; live = null; active = null; $("bar").hidden = true; }
  };
})();

// ----- Routing: #book1 opens a book, empty hash shows the library -----
function route() {
  const bk = BOOKS.find(b => b.id === location.hash.slice(1));
  bk ? openBook(bk) : closeBook();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
